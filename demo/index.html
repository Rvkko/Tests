<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Supply · QA Practice Store</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11171c;color:#eff4f6;font:16px/1.6 system-ui}main{max-width:850px;margin:auto;padding:2rem 1rem}h1{line-height:1.15}input,button{font:inherit;padding:.7rem 1rem;border-radius:6px;border:1px solid #59717e;background:#25343d;color:inherit;min-height:44px}label{display:block;margin:1rem 0}input{display:block;max-width:100%;width:340px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}section,article{border:1px solid #41535d;padding:1.3rem;margin:1rem 0;border-radius:8px}.row{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}.message{color:#d8ed9f;min-height:2em}[hidden]{display:none!important}:focus-visible{outline:3px solid #d8ed9f;outline-offset:3px}.note{color:#b5c3cb;font-size:.9rem}</style></head><body><main><p class="note">LOCAL QA LAB / SYNTHETIC DATA ONLY</p><h1>Orbit Supply</h1><p>A small, repeatable target for browser and API tests. No payments, emails, or real accounts.</p><p class="message" id="message" role="status"></p><section id="login"><h2>Sign in</h2><p class="note">Practice login: qa@example.test / PracticeOnly!42</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><section id="store" hidden><div class="row"><h2>Shop</h2><button id="logout">Sign out</button></div><div id="products"></div><h2>Your cart</h2><div id="cart"></div><p id="total"></p><button id="checkout">Place practice order</button><p id="order" role="status"></p></section></main><script src="app.js"></script></body></html>
